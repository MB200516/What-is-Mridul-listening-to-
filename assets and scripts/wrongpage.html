<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
    <style>
        * { margin: 0;
            padding: 0; 
            box-sizing: border-box; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            min-width: 768px;
            min-height: 432px;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: fill;
            z-index: 0;
        }
        #m1 {
            position: fixed;
            bottom: 0;
            left: 50%;
            width: 27%;
            height: auto;
            z-index: 2;
            transform: translateX(-50%) scale(0);
            transform-origin: bottom center;
            opacity: 0;
            animation: floatIn 4s cubic-bezier(0.34, 1.56, 0.64, 1) 1s forwards;
        }

        @keyframes floatIn {
            0% {
                transform: translateX(-50%) scale(0);
                opacity: 0;
            }
            60% {
                transform: translateX(-50%) scale(1.08);
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }
        #wr {
    font-family: 'Jersey 15', sans-serif;
    position: fixed;
    top: 13%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 17rem;
    color: #BD0B0B;
    z-index: 2;
    -webkit-text-stroke: 3px #000;
    white-space: nowrap;
    overflow: hidden;
    border-right: 3px solid #000;
    width: 0;
    animation: typewriter 4s steps(40) 1s 1 normal both,
               blinkTextCursor 500ms steps(40) infinite normal;
}
        @keyframes typewriter {
        from { width: 0; }
        to { width: 45%; }
        }
          @keyframes typewriterson {
        from { width: 0; }
        to { width: 20%; }
        }
         @keyframes blinkTextCursor {
        from { border-right-color: rgba(255,255,255,0.75); }
        to { border-right-color: transparent; }
       }
       #wr2 {
        z-index: 2;
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: typewriterson 2s steps(40) 5s 1 normal both,
               blinkTextCursor 500ms steps(40) infinite normal;
        font-size: 5rem;
        overflow: hidden;
        white-space: nowrap;


       }
       #blast{
            position: fixed;
            bottom: 0;
            left: 5%;
            width: 90%;
            height: auto;
            z-index: 1;
        
        }

        @keyframes blastIn {
            0% {
                transform: translateX(-50%) scale(0);
                opacity: 0;
            }
            60% {
                transform: translateX(-50%) scale(1.08);
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }

    </style>
</head>
<body>
    <img id="bg" src="background.png" draggable="false">
    <img id="m1" src="m1.png" draggable="false">
    <div id="wr">WRONG</div>
    <div id="wr2">You died</div>
    <img id="blast" src="blast.png" draggable="false">
</body>
</html>
