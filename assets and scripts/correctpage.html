<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>* { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            min-width: 768px;
            min-height: 432px;
        }

        #bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: fill;
            z-index: 0;
        }
         #text {
            position: fixed;
            top: 18%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.7rem;
            color: #000;
            z-index: 2;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #fff;
            width: 0;
            animation: typewriter 4s steps(40) 1s 1 normal both,
               blinkTextCursor 500ms steps(40) infinite normal;
}
        @keyframes typewriter {
        from { width: 0; }
        to { width: 47%; }
        }
         @keyframes typewriterson {
        from { width: 0; }
        to { width: 21%; }
        }


        @keyframes blinkTextCursor {
        from { border-right-color: rgba(255,255,255,0.75); }
        to { border-right-color: transparent; }
       }
       
       #coffee {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.7rem;
            color: #000;
            z-index: 2;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #fff;
            width: 0;
            animation: typewriterson 2s steps(40) 5s 1 normal both,
               blinkTextCursor 500ms steps(40) infinite normal;
       }
       #meme1 {
            position: fixed;
            bottom: 5%;
            left: 5%;
            transform: translateX(-50%);
            width: 20vw;
            height: auto;
            z-index: 2;
            bottom:0;
       }
       #meme2 {
            position: fixed;
            bottom: 0;
            right: 10%;
            transform: translateX(50%);
            width: 30vw;
            height: auto;
            z-index: 2;
            bottom:0;
       }
         #meme3 {
                position: fixed;
                bottom: 0;
                right: 50%;
                transform: translateX(50%);
                width: 20vw;
                height: auto;
                z-index: 2;
                bottom:0;
         }
         #linkedinlogo {
            position: fixed;
            bottom: 1%;
            left:15%;
            transform: translateX(50%);
            width: 4vw;
            height: auto;
            z-index: 2;
            border-radius: 30%;
         }
        </style>
</head>
<body>
    <img id="bg" src="background.png"  draggable="false"/>
    <div id="text">Congrats!!! Mridul owes you a coffee...</div>
    <div id="coffee">Ask her for one!!!</div>
    <img id="meme1" src="meme1.png" alt="Meme 1" draggable="false"/>
    <img id="meme2" src="meme2.png" alt="Meme 2" draggable="false"/>
    <img id="meme3" src="meme3.png" alt="Meme 3" draggable="false"/>
    
    <audio id="congrats" src="congratulations.mp3" ></audio>
    <div id="linkedinlogo">
        <a href="https://www.linkedin.com/in/mridul-bhatt11" target="_blank">
            <img src="linkedinlogo.avif" alt="LinkedIn Logo" style="width: 100%; height: auto; border-radius: 30%;">
        </a>
        <div style="font-size: 1.2rem;"><b>Let's connect!</b></div>
    </div>

    <script>
    const audio = document.getElementById('congrats');

    audio.play().catch(() => {
        document.body.addEventListener('click', () => audio.play(), { once: true });
    });
    </script>
</body>
</html>
